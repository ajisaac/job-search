<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job capture</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<label class="row">
    <input type="checkbox" id="enabled">
    Capture job pages as I browse
</label>

<button type="button" id="capture">Capture this page</button>

<p class="last" id="last">Nothing captured yet.</p>

<label class="field">
    Webapp address
    <input type="url" id="server" placeholder="http://localhost:8080">
</label>

<script src="popup.js"></script>
</body>
</html>
