<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="jobs-page" th:attr="data-status=${filter.status}">

<header class="bar">
    <nav class="bar__row" aria-label="Status">
        <a class="bar__home" href="/">Jobs</a>
        <a th:each="status : ${statuses}" class="tab" th:classappend="${status == filter.status} ? 'tab--active'"
           th:href="|/?status=${status}&${withoutStatus}|" th:attr="data-status=${status}">
            <span th:text="${#strings.capitalize(status)}">New</span>
            <span class="tab__count" th:text="${statusCounts[status]} ?: 0">0</span>
        </a>
        <a class="tab bar__titles" href="/titles">Titles</a>
    </nav>

    <div class="bar__row">
        <form class="search" action="/" method="get">
            <label class="sr-only" for="q">Search</label>
            <input id="q" name="q" type="search" autocomplete="off" th:value="${filter.query}"
                   placeholder="java, kotlin, title: senior, company: acme">
            <input type="hidden" name="status" th:value="${filter.status}">
            <input type="hidden" name="site" th:value="${filter.jobSite}">
            <kbd>/</kbd>
        </form>

        <nav class="sites" aria-label="Site">
            <a class="chip" th:classappend="${filter.jobSite == 'all'} ? 'chip--active'"
               th:href="|/?site=all&${withoutSite}|">All sites</a>
            <a th:each="site : ${sites}" class="chip" th:classappend="${filter.jobSite == site.key} ? 'chip--active'"
               th:href="|/?site=${site.key}&${withoutSite}|" th:attr="data-site=${site.key}">
                <span th:text="${site.value}">Indeed</span>
                <span class="chip__count" th:text="${siteCounts[site.key]} ?: 0">0</span>
            </a>
        </nav>
    </div>
</header>

<main class="split">
    <ol class="list" id="list" aria-label="Jobs">
        <li th:each="job : ${jobs}">
            <button type="button" class="list__item"
                    th:attr="data-id=${job.id},data-url=${job.url},data-site=${job.job_site}">
                <span class="list__title" th:text="${job.title}">Senior Java Engineer</span>
                <span class="list__meta">
                    <span th:text="${job.company}">Acme</span>
                    · <span th:text="${sites[job.job_site]} ?: ${job.job_site}">Indeed</span>
                    <th:block th:if="${job.job_posting_date != null}">· <span th:text="${job.job_posting_date}"></span></th:block>
                    <span class="list__applied"
                          th:if="${(job.companyStatuses.contains('applied') or job.companyStatuses.contains('interviewing')) and job.status != 'applied' and job.status != 'interviewing'}">· applied here</span>
                </span>
            </button>
        </li>
        <li th:if="${jobs.isEmpty()}" class="list__empty">No jobs match these filters.</li>
    </ol>

    <section class="detail" id="detail" aria-live="polite">
        <p class="detail__empty">Select a job to see it here.</p>
    </section>
</main>

<footer class="hints">
    <span><kbd>j</kbd> <kbd>k</kbd> next / previous</span>
    <span><kbd>i</kbd> <kbd>l</kbd> <kbd>a</kbd> <kbd>d</kbd> set status and move on</span>
    <span><kbd>o</kbd> open posting</span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>esc</kbd> leave search</span>
</footer>

<script>
    const list = document.getElementById('list')
    const detail = document.getElementById('detail')
    const search = document.getElementById('q')
    const query = new URLSearchParams(location.search).get('q') || ''
    const currentStatus = document.body.dataset.status
    let selected = null

    function items() {
        return Array.from(list.querySelectorAll('.list__item'))
    }

    function showMessage(text) {
        const p = document.createElement('p')
        p.className = 'detail__empty'
        p.textContent = text
        detail.replaceChildren(p)
    }

    // Highlight a job in the list and load its details into the right hand pane.
    function select(item) {
        if (!item) return
        if (selected) {
            selected.classList.remove('list__item--selected')
            selected.removeAttribute('aria-current')
        }
        selected = item
        item.classList.add('list__item--selected')
        item.setAttribute('aria-current', 'true')
        item.scrollIntoView({block: 'nearest'})

        fetch('/job/' + item.dataset.id + '?q=' + encodeURIComponent(query))
            .then(response => response.ok ? response.text() : Promise.reject(response.status))
            .then(html => {
                if (selected !== item) return
                detail.innerHTML = html
                detail.scrollTop = 0
            })
            .catch(() => {
                if (selected === item) showMessage("Couldn't load this job. Try selecting it again.")
            })
    }

    function move(by) {
        const all = items()
        const index = all.indexOf(selected)
        select(all[index + by])
    }

    function bump(selector, by) {
        const count = document.querySelector(selector)
        if (count) count.textContent = parseInt(count.textContent) + by
    }

    // Save the new status, take the job out of this list, and move on to the next one.
    function setStatus(status) {
        const item = selected
        if (!item) return

        fetch('/status/' + item.dataset.id + '/' + status, {method: 'POST'}).then(response => {
            if (!response.ok) return

            const all = items()
            const index = all.indexOf(item)
            const next = all[index + 1] || all[index - 1]
            item.closest('li').remove()

            bump('.tab[data-status="' + currentStatus + '"] .tab__count', -1)
            bump('.tab[data-status="' + status + '"] .tab__count', 1)
            bump('.chip[data-site="' + item.dataset.site + '"] .chip__count', -1)

            if (next) {
                select(next)
            } else {
                selected = null
                showMessage('Nothing left here.')
            }
        })
    }

    list.addEventListener('click', event => {
        const item = event.target.closest('.list__item')
        if (item) select(item)
    })

    detail.addEventListener('click', event => {
        const button = event.target.closest('button[data-status]')
        if (button) setStatus(button.dataset.status)
    })

    document.addEventListener('keydown', event => {
        if (event.metaKey || event.ctrlKey || event.altKey) return

        if (event.target.matches('input, textarea, select')) {
            if (event.key === 'Escape') event.target.blur()
            return
        }

        if (event.key === '/') {
            event.preventDefault()
            search.focus()
            search.select()
        } else if (event.key === 'j' || event.key === 'ArrowDown') {
            event.preventDefault()
            move(1)
        } else if (event.key === 'k' || event.key === 'ArrowUp') {
            event.preventDefault()
            move(-1)
        } else if (event.key === 'o') {
            if (selected) window.open(selected.dataset.url, '_blank', 'noopener')
        } else {
            // status shortcuts come from the buttons in the detail pane
            const button = detail.querySelector('button[data-key="' + event.key + '"]')
            if (button) {
                event.preventDefault()
                setStatus(button.dataset.status)
            }
        }
    })

    select(items()[0])
</script>
</body>
</html>
