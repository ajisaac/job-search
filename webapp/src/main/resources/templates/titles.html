<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titles</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="titles-page">

<header class="bar">
    <nav class="bar__row" aria-label="Pages">
        <a class="bar__home" href="/">Jobs</a>
        <a class="tab tab--active" href="/titles" aria-current="page">
            <span>New titles</span>
            <span class="tab__count" id="count" th:text="${jobs.size()}">0</span>
        </a>
    </nav>

    <div class="bar__row">
        <form class="search" action="/titles" method="get">
            <label class="sr-only" for="title">Search titles</label>
            <input id="title" name="title" type="search" autocomplete="off" th:value="${filter.titleSearch}"
                   placeholder="backend, platform, java">
            <kbd>/</kbd>
        </form>
    </div>
</header>

<main class="titles">
    <ol class="titles__list" id="list" aria-label="New job titles">
        <li th:each="job : ${jobs}" class="title-row" th:attr="data-id=${job.id},data-url=${job.url}">
            <div class="title-row__text">
                <a class="title-row__title" th:href="${job.url}" target="_blank" rel="noopener"
                   th:text="${job.title}">Senior Java Engineer</a>
                <span class="title-row__meta">
                    <span th:text="${job.company}">Acme</span>
                    · <span th:text="${sites[job.job_site]} ?: ${job.job_site}">Indeed</span>
                </span>
            </div>
            <div class="title-row__actions">
                <button type="button" class="action" data-status="declined">Decline <kbd>d</kbd></button>
                <button type="button" class="action" data-status="interested">Interested <kbd>i</kbd></button>
            </div>
        </li>
        <li th:if="${jobs.isEmpty()}" class="list__empty">No new titles match.</li>
    </ol>
</main>

<footer class="hints">
    <span><kbd>j</kbd> <kbd>k</kbd> next / previous</span>
    <span><kbd>d</kbd> decline</span>
    <span><kbd>i</kbd> interested</span>
    <span><kbd>o</kbd> open posting</span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>esc</kbd> leave search</span>
</footer>

<script>
    const list = document.getElementById('list')
    const search = document.getElementById('title')
    const count = document.getElementById('count')
    let selected = null

    function rows() {
        return Array.from(list.querySelectorAll('.title-row'))
    }

    function select(row) {
        if (!row) return
        if (selected) {
            selected.classList.remove('title-row--selected')
            selected.removeAttribute('aria-current')
        }
        selected = row
        row.classList.add('title-row--selected')
        row.setAttribute('aria-current', 'true')
        row.scrollIntoView({block: 'nearest'})
    }

    function move(by) {
        const all = rows()
        select(all[all.indexOf(selected) + by])
    }

    // Save the new status, take the title out of the list, and move on to the next one.
    function setStatus(row, status) {
        if (!row) return

        fetch('/status/' + row.dataset.id + '/' + status, {method: 'POST'}).then(response => {
            if (!response.ok) return

            const all = rows()
            const index = all.indexOf(row)
            const next = all[index + 1] || all[index - 1]
            row.remove()
            count.textContent = parseInt(count.textContent) - 1

            if (row === selected) {
                selected = null
                select(next)
            }
        })
    }

    list.addEventListener('click', event => {
        const row = event.target.closest('.title-row')
        if (!row) return

        const button = event.target.closest('button[data-status]')
        if (button) {
            setStatus(row, button.dataset.status)
        } else if (!event.target.closest('a')) {
            select(row)
        }
    })

    document.addEventListener('keydown', event => {
        if (event.metaKey || event.ctrlKey || event.altKey) return

        if (event.target.matches('input, textarea, select')) {
            if (event.key === 'Escape') event.target.blur()
            return
        }

        if (event.key === '/') {
            event.preventDefault()
            search.focus()
            search.select()
        } else if (event.key === 'j' || event.key === 'ArrowDown') {
            event.preventDefault()
            move(1)
        } else if (event.key === 'k' || event.key === 'ArrowUp') {
            event.preventDefault()
            move(-1)
        } else if (event.key === 'd') {
            setStatus(selected, 'declined')
        } else if (event.key === 'i') {
            setStatus(selected, 'interested')
        } else if (event.key === 'o') {
            if (selected) window.open(selected.dataset.url, '_blank', 'noopener')
        }
    })

    select(rows()[0])
</script>
</body>
</html>
